# Fair all-five comparison on one common 10k training subset.
# Every method sees exactly the same rows and the same 70/15/15 split.
experiment: main_capped
methods: [smo, pegasos, admm, pa_admm, cvxpy]
seeds: [0, 1, 2]
cost_ratios: [10, 20, 50]
# Fixed across methods for an identical QP; thresholds remain validation-only.
C_grid: [1.0]
tolerance: 0.001
time_budget_sec: 5400
reference_method: null
reuse_existing: true
method_kwargs:
  admm:
    rho0: 1.0
    adaptive_rho: true
    alpha: 1.0
    max_iter: 20000
  pa_admm:
    max_iter: 20000
data:
  subset_n: 10000
  subset_seed: 0
  split_protocol: stratified
  use_saved_splits: false
notes: >-
  All five methods receive exactly the same 10k training subset and fixed C=1.
  This is the fair all-method fallback if SMO/CVXPY cannot complete the
  full-data main_full matrix. No per-method caps.
