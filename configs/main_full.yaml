# Final comparison on the full cleaned ULB dataset.
experiment: main_full
methods: [smo, pegasos, admm, pa_admm, cvxpy]
seeds: [0, 1, 2, 3, 4]
cost_ratios: [10, 20, 50]
# Fixed across methods: the objective/time-to-tolerance comparison must solve
# the same QP. Thresholds are still selected on validation only.
C_grid: [1.0]
tolerance: 0.001
time_budget_sec: 5400
reference_method: null
# Reuse successful runs whose data and hyperparameters match exactly; rerun
# failed runs. Use overwrite: true to force a complete refit.
reuse_existing: true
# The main baseline uses adaptive rho; the fixed-rho cold control is the
# admm-cold variant in the ablation config.
method_kwargs:
  admm:
    rho0: 1.0
    adaptive_rho: true
    alpha: 1.0
    max_iter: 20000
  pa_admm:
    max_iter: 20000
data:
  subset_n: null
  split_protocol: stratified
  use_saved_splits: true
notes: >-
  All five methods receive the full cleaned training set (198,608 rows), the
  same saved split, and the same fixed C=1, so objective and time-to-tolerance
  compare the same QP. No per-method caps. Validation-only threshold selection
  remains. SMO/CVXPY may time out or run out of memory; those runs are recorded
  as failures and are not ranked. Use main_capped for the all-five same-10k
  comparison if they fail. Use configs/predictive.yaml for validation-tuned C.
