# Shared defaults. Experiment YAMLs are deep-merged onto this file.
experiment: base
dataset: ulb

methods: [pegasos, admm, pa_admm]
seeds: [0]
cost_ratios: [10]
# Default tuning grid. Fixed-QP solver comparisons override this with [1.0].
C_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
tolerance: 0.0001
time_budget_sec: 5400
hard_timeout_sec: 5400
# Train with cost_ratio; select threshold and report cost under this common
# evaluation cost when set. null means "same as the training cost ratio".
evaluation_cost_ratio: null

method_kwargs:
  smo: {}
  # Minibatch Pegasos: batch 64 reached the best objective per second on the
  # real 7k subset. One epoch is a full pass, so the 90-minute budget, not the
  # epoch count, is the binding limit at full scale. Checkpoints are per epoch
  # and the averaged iterate is what gets evaluated; converged stays False.
  pegasos:
    epochs: 5000
    batch_size: 64
  admm:
    rho0: 1.0
    adaptive_rho: false
    alpha: 1.0
  pa_admm:
    K: 10
    rho0: 1.0
    adaptive_rho: true
    alpha: 1.6

# If set, reference_objective is taken from this method. Otherwise the best
# observed objective on the same dataset/seed/ratio/n_train/C is used.
reference_method: null

data:
  source: ulb
  raw_path: data/raw/creditcard.csv
  splits_dir: data/splits
  split_protocol: stratified
  subset_n: null
  subset_seed: per_seed
  drop_duplicates: true
  standardize_amount: true
  use_saved_splits: true
  synthetic_n_list: []
  synthetic_d: 20
  synthetic_fraud_rate: 0.01
  synthetic_separation: 3.0

data_variants: []
method_variants: []

paths:
  results_dir: results
  log_dir: results/logs
  tables_dir: results/tables
  figures_dir: results/figures

logging:
  level: INFO

aggregate: true
history_max_points: 10000
# Never silently overwrite a run; set true only for disposable local reruns.
overwrite: false
notes: null
